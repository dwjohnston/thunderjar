# Grafana for the CI timing metrics, at http://localhost:3000. See ../README.md.
services:
  grafana:
    image: grafana/grafana:13.3.1
    ports: ["3000:3000"]
    environment:
      # Local only: no login.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/ci-timings.json
      # Supabase's session pooler: its direct host is IPv6 only.
      CI_METRICS_DB_HOST: ${CI_METRICS_DB_HOST:-aws-0-ap-southeast-2.pooler.supabase.com:5432}
      CI_METRICS_DB_USER: ${CI_METRICS_DB_USER:-postgres.oojmoxinrsflssiecitj}
      CI_METRICS_DB_SSLMODE: ${CI_METRICS_DB_SSLMODE:-require}
      CI_METRICS_DB_PASSWORD: ${CI_METRICS_DB_PASSWORD:?Set CI_METRICS_DB_PASSWORD to the database password}
    volumes:
      - ./provisioning:/etc/grafana/provisioning:ro
