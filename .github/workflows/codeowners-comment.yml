# Keeps a comment on each PR listing the files it changes that need a code owner's approval,
# linked to their diffs, so it's clear what the approval is for. Updated on every push, and
# edited to say so once the PR no longer changes any.
name: CODEOWNERS comment

on:
  # pull_request_target, so PRs from bots and forks get a token that can comment. It runs the
  # base branch's workflow and script, never the PR's code, and reads the base's CODEOWNERS,
  # which is the one GitHub applies.
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: codeowners-comment-${{ github.event.pull_request.number }}

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun scripts/codeowners-comment.ts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
