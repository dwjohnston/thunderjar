name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Typecheck & Test (Bun)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

  node:
    name: Test & Build (Node)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test (node:test)
        run: npm test

      - name: Build CLI bin
        run: npm run build

      - name: Smoke test built CLI
        run: |
          cd evaluation-sandbox
          timeout 10 node ../dist/cli.js --config thunderjar.config.ts < /dev/null > out.log 2>&1 || true
          grep -q "What would you like to do" out.log
