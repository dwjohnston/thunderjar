name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # For postgresStore's tests, which are skipped without THUNDERJAR_POSTGRES_URL.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
        env:
          THUNDERJAR_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres
      # Ubuntu 24.04's AppArmor stops unconfined processes making user namespaces, whatever
      # docker run is told. Scenario 0206's sandboxing agent needs them, as Claude Code's
      # bubblewrap sandbox does.
      - name: Let containers make user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Docker image tests (GitHub's Ubuntu runners have Docker)
        run: bun run test:docker
      - name: Installed package smoke test
        run: bun run test:package

  build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
