name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      # Ubuntu 24.04's AppArmor stops unconfined processes making user namespaces, whatever
      # docker run is told. Scenario 0206's sandboxing agent needs them, as Claude Code's
      # bubblewrap sandbox does.
      - name: Let containers make user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Docker image tests (GitHub's Ubuntu runners have Docker)
        run: bun run test:docker
      - name: Installed package smoke test
        run: bun run test:package

  build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
