name: Publish PR preview

on:
  issue_comment:
    types: [created]

jobs:
  build:
    if: github.event.issue.pull_request && github.event.comment.body == '/preview'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      number: ${{ steps.request.outputs.number }}
      sha: ${{ steps.request.outputs.sha }}
      version: ${{ steps.request.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Authorize request and capture PR commit
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/release/preview-request.ts
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.request.outputs.sha }}
          persist-credentials: false
      - run: bun install --frozen-lockfile
      - name: Set commit-specific package version
        env:
          PREVIEW_VERSION: ${{ steps.request.outputs.version }}
        run: bun scripts/release/set-preview-version.ts "$PREVIEW_VERSION"
      - run: bun run build
      - name: Pack without lifecycle scripts
        run: |
          rm -rf "$RUNNER_TEMP/preview"
          mkdir -p "$RUNNER_TEMP/preview"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/preview"
      - uses: actions/upload-artifact@v4
        with:
          name: preview-package
          path: ${{ runner.temp }}/preview/*.tgz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: preview-package
          path: ${{ runner.temp }}/preview
      - name: Verify package and publish if new
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_VERSION: ${{ needs.build.outputs.version }}
          PREVIEW_SHA: ${{ needs.build.outputs.sha }}
          PR_NUMBER: ${{ needs.build.outputs.number }}
        run: |
          state=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .state)
          test "$state" = open
          mapfile -t packages < <(find "$RUNNER_TEMP/preview" -maxdepth 1 -name '*.tgz' -type f)
          test "${#packages[@]}" -eq 1
          package="${packages[0]}"
          test "$(tar -xOf "$package" package/package.json | jq -r .name)" = thunderjar
          test "$(tar -xOf "$package" package/package.json | jq -r .version)" = "$PREVIEW_VERSION"
          test "$(tar -xOf "$package" package/package.json | jq -r .repository.url)" = 'git+https://github.com/dwjohnston/thunderjar.git'
          status=$(curl -sS -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/thunderjar/$PREVIEW_VERSION")
          case "$status" in
            200) echo "Preview already published" ;;
            404) npm publish "$package" --tag preview --ignore-scripts --access public ;;
            *) echo "npm registry returned $status" >&2; exit 1 ;;
          esac
          body_file="$RUNNER_TEMP/preview-comment.md"
          printf 'Preview for commit `%s`: `npm install thunderjar@%s`\n' "$PREVIEW_SHA" "$PREVIEW_VERSION" > "$body_file"
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$body_file"
