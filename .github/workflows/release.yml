name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      stable_published: ${{ steps.changesets.outputs.published }}
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Identify a merged RC
        id: package
        run: |
          version=$(node -p "require('./package.json').version")
          previous=$(git show HEAD^:package.json | node -e 'let data=""; process.stdin.on("data", chunk => data += chunk).on("end", () => console.log(JSON.parse(data).version))')
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ && "$version" != "$previous" ]]; then
            echo "rc=true" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish RC to npm and GitHub
        if: steps.package.outputs.rc == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RC_VERSION: ${{ steps.package.outputs.version }}
        run: |
          stable_version="${RC_VERSION%-rc.*}"
          status=$(curl -sS -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/thunderjar/$stable_version")
          case "$status" in
            404) ;;
            200) echo "Stable version $stable_version already exists; refusing stale RC" >&2; exit 1 ;;
            *) echo "npm registry returned $status" >&2; exit 1 ;;
          esac
          bunx changeset publish --tag rc
          git push origin "v${RC_VERSION}"
          if ! gh release view "v${RC_VERSION}" >/dev/null 2>&1; then
            gh release create "v${RC_VERSION}" --verify-tag --prerelease --generate-notes
          fi
      - name: Maintain stable Version Packages PR or publish stable release
        id: changesets
        uses: changesets/action@v1
        with:
          publish: bun run release
          version: bun run version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  rc_pr:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Calculate RC version and release notes
        id: rc
        run: bun scripts/release/prepare-rc-pr.ts
      - name: Maintain RC PR
        uses: peter-evans/create-pull-request@v8
        with:
          branch: changeset-release-rc/main
          base: main
          delete-branch: true
          commit-message: "Version thunderjar for release candidate"
          title: ${{ steps.rc.outputs.title || 'Release candidate' }}
          body: ${{ steps.rc.outputs.body || 'Release candidate is no longer needed.' }}

  docs:
    needs: release
    if: needs.release.outputs.stable_published == 'true'
    uses: ./.github/workflows/docs.yml
    permissions:
      contents: read
      pages: write
      id-token: write
