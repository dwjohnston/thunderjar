name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # changesets/action shells out to npm/node under the hood, and npm
      # trusted publishing needs a recent npm (11.5.1+), which Node 24 ships.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          publish: bun run release
          version: bun run version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Version PRs are opened by GITHUB_TOKEN, which doesn't trigger other
      # workflows, so docs.yml keys off this label when the PR is merged.
      - name: Label version PR for docs deploy
        if: steps.changesets.outputs.pullRequestNumber != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create update-docs --color 0e8a16 --force
          gh pr edit "${{ steps.changesets.outputs.pullRequestNumber }}" --add-label update-docs
